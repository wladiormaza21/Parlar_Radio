content:
  - name: publicaciones
    label: Publicaciones
    path: publicaciones.json
    type: json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: string
        required: true
      - name: categoria
        label: Categoria
        type: select
        required: true
        options:
          - label: Musica
            value: musica
          - label: Cultura
            value: cultura
          - label: Informacion
            value: informacion
          - label: Lo Nuestro
            value: lo-nuestro
      - name: titulo
        label: Titulo
        type: string
        required: true
      - name: fecha
        label: Fecha
        type: string
      - name: imagen
        label: Imagen
        type: string
      - name: resumen
        label: Resumen
        type: text
      - name: contenido
        label: Contenido
        type: text
