<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PARLAR RADIO | Somos Mundo</title>

<style>

/* =========================================================
   PARLAR RADIO — DISEÑO WEB
   ========================================================= */

:root{
    --pink:#ff0084;
    --pink2:#ff3ca4;
    --cyan:#00e5ff;
    --blue:#168cff;
    --green:#00f59a;
    --yellow:#ffd400;
    --dark:#030611;
    --dark2:#071020;
    --card:#0b1426;
    --text:#f7f9ff;
    --muted:#9aa8bd;
    --border:rgba(255,255,255,.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,rgba(0,229,255,.16),transparent 35%),
        radial-gradient(circle at 10% 35%,rgba(255,0,132,.12),transparent 30%),
        radial-gradient(circle at 90% 65%,rgba(0,229,255,.08),transparent 30%),
        var(--dark);
    color:var(--text);
    min-height:100vh;
    padding-bottom:110px;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(3,6,17,.92);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(0,229,255,.12);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    min-height:82px;
    padding:12px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

/* Logo header */

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-logo{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(0,229,255,.5);
    box-shadow:
        0 0 18px rgba(255,0,132,.45),
        0 0 30px rgba(0,229,255,.20);
}

.brand-text strong{
    display:block;
    font-size:25px;
    line-height:1;
    font-weight:900;
    letter-spacing:-1px;
}

.brand-text strong span{
    color:var(--pink);
}

.brand-text small{
    display:block;
    margin-top:8px;
    color:var(--cyan);
    font-size:10px;
    letter-spacing:5px;
    font-weight:800;
}

/* Desktop menu */

.nav{
    display:flex;
    align-items:center;
    gap:5px;
}

.nav a{
    padding:10px 14px;
    border-radius:10px;
    color:#c9d3e2;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    transition:.25s;
}

.nav a:hover{
    color:white;
    background:rgba(255,255,255,.06);
}

/* Mobile menu */

.menu-button{
    width:48px;
    height:48px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.12);
    background:#10192b;
    color:white;
    font-size:24px;
    cursor:pointer;
    display:none;
}

.mobile-menu{
    display:none;
    padding:10px 20px 20px;
    border-top:1px solid rgba(255,255,255,.06);
}

.mobile-menu a{
    display:block;
    padding:14px;
    border-radius:10px;
    margin-top:5px;
    color:#dce5f2;
    font-weight:700;
}

.mobile-menu a:hover{
    background:rgba(255,255,255,.06);
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
    position:relative;
    overflow:hidden;
    padding:70px 20px 90px;
}

.hero::before{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    left:50%;
    top:30%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(circle,
        rgba(255,0,132,.16),
        rgba(0,229,255,.09) 40%,
        transparent 70%);
    filter:blur(30px);
    pointer-events:none;
}

.hero-inner{
    position:relative;
    z-index:2;
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:55px;
    align-items:center;
}

/* Hero text */

.live-label{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:9px 15px;
    border-radius:30px;
    background:rgba(255,0,132,.08);
    border:1px solid rgba(255,0,132,.35);
    color:white;
    font-size:11px;
    font-weight:900;
    letter-spacing:1px;
}

.live-dot{
    width:9px;
    height:9px;
    background:#ff1744;
    border-radius:50%;
    box-shadow:0 0 15px #ff1744;
    animation:pulse 1.4s infinite;
}

@keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.45;transform:scale(.7);}
}

.hero h1{
    margin-top:24px;
    font-size:clamp(48px,7vw,86px);
    line-height:.9;
    font-weight:1000;
    letter-spacing:-4px;
}

.hero h1 .white{
    color:white;
}

.hero h1 .pink{
    color:var(--pink);
    text-shadow:0 0 30px rgba(255,0,132,.3);
}

.slogan{
    margin-top:18px;
    font-size:clamp(19px,3vw,29px);
    font-weight:900;
    letter-spacing:8px;
    background:linear-gradient(90deg,var(--cyan),white,var(--pink));
    -webkit-background-clip:text;
    color:transparent;
}

.hero-description{
    margin-top:25px;
    max-width:620px;
    color:#aebbd0;
    font-size:16px;
    line-height:1.8;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:13px;
    margin-top:30px;
}

.btn{
    border:0;
    cursor:pointer;
    padding:16px 23px;
    border-radius:14px;
    font-size:12px;
    font-weight:900;
    letter-spacing:.7px;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    color:white;
    background:linear-gradient(100deg,var(--pink),#ff0062);
    box-shadow:
        0 0 20px rgba(255,0,132,.3),
        0 10px 30px rgba(0,0,0,.3);
}

.btn-secondary{
    color:#d9e3ef;
    background:#101a2c;
    border:1px solid rgba(255,255,255,.10);
}

.btn-whatsapp{
    color:#00ff9d;
    background:rgba(0,255,150,.06);
    border:1px solid rgba(0,255,150,.25);
}

/* =========================================================
   LOGO PRINCIPAL
   ========================================================= */

.logo-showcase{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-box{
    position:relative;
    width:min(480px,90vw);
    aspect-ratio:1/1;
    padding:13px;
    border-radius:38px;

    background:
        linear-gradient(#071020,#071020) padding-box,
        linear-gradient(
            135deg,
            var(--blue),
            var(--cyan),
            var(--pink),
            var(--yellow)
        ) border-box;

    border:3px solid transparent;

    box-shadow:
        0 0 40px rgba(255,0,132,.25),
        0 0 80px rgba(0,229,255,.12);

    animation:logoGlow 5s infinite alternate;
}

@keyframes logoGlow{
    from{
        box-shadow:
        0 0 35px rgba(255,0,132,.25),
        0 0 60px rgba(0,229,255,.10);
    }

    to{
        box-shadow:
        0 0 55px rgba(255,0,132,.40),
        0 0 90px rgba(0,229,255,.20);
    }
}

.logo-box img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    border-radius:27px;
}

/* Small decorative text */

.logo-caption{
    position:absolute;
    left:50%;
    bottom:-25px;
    transform:translateX(-50%);
    white-space:nowrap;

    padding:10px 20px;
    border-radius:30px;

    background:rgba(5,10,22,.92);
    border:1px solid rgba(0,229,255,.25);

    color:var(--cyan);
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
}

/* =========================================================
   SECTION
   ========================================================= */

.section{
    max-width:1200px;
    margin:auto;
    padding:85px 20px;
}

.section-heading{
    text-align:center;
    margin-bottom:45px;
}

.section-heading .eyebrow{
    color:var(--cyan);
    font-size:10px;
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;
}

.section-heading h2{
    margin-top:10px;
    font-size:clamp(28px,4vw,42px);
    font-weight
</body>
</html>
